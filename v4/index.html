<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heavy Equipment Auction — LIVE</title>
<meta name="build-version" content="1.0.0">
<link rel="stylesheet" href="../shared/tile.css?v=6">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER (RB-style) ── */
  .header {
    background: #FFFFFF;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  /* toolbar row */
  .header-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.10);
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .header-icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #2F3F51;
    padding: 4px;
    display: flex;
    align-items: center;
    border-radius: 4px;
  }
  .header-icon-btn:hover { background: #F4F4F4; }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .header-logo-text {
    font-size: 17px;
    font-weight: 900;
    color: #000;
    letter-spacing: -0.3px;
    white-space: nowrap;
  }

  /* search */
  .header-search {
    flex: 1;
    max-width: 520px;
  }
  .header-search-wrap {
    display: flex;
    align-items: center;
    border: 1px solid #CFCFCF;
    border-radius: 4px;
    overflow: hidden;
    background: #fff;
  }
  .header-search-wrap:focus-within { border-color: var(--orange); box-shadow: 0 0 0 2px rgba(245,124,0,0.15); }
  .header-search-input {
    flex: 1;
    border: none;
    outline: none;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--navy);
    background: transparent;
  }
  .header-search-btn {
    background: none;
    border: none;
    border-left: 1px solid #E7E7E7;
    padding: 7px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .header-search-btn:hover { background: #F4F4F4; }

  /* right nav */
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .header-nav-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    text-decoration: none;
    color: rgba(0,0,0,0.87);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .header-nav-link:hover { color: var(--orange); }
  .header-nav-link svg { color: inherit; }
  .header-avatar {
    position: relative;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--navy);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-dot {
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 9px;
    height: 9px;
    background: var(--green);
    border-radius: 50%;
    border: 2px solid #fff;
  }

  /* bottom nav row */
  .header-nav {
    border-top: 1px solid rgba(0,0,0,0.10);
  }
  .header-nav-inner {
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 0;
  }
  .header-nav-item {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(0,0,0,0.87);
    background: none;
    border: none;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
  }
  .header-nav-item:hover { color: var(--orange); border-bottom-color: var(--orange); }
  .header-nav-sell {
    font-weight: 900;
    font-size: 13px;
  }

  /* ── LIVE BADGE (used in header if needed) ── */
  .live-badge {
    background: var(--red);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 3px 7px;
    border-radius: 3px;
    animation: livePulse 2s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }


  /* grid, tile, bid-btn — see ../shared/tile.css */

  /* ── TOASTS ── */
  .toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 7px;
    align-items: flex-end;
    pointer-events: none;
  }
  .toast {
    background: #FFFFFF;
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--orange);
    color: var(--navy);
    font-size: 12px;
    font-weight: 600;
    padding: 9px 13px;
    border-radius: 5px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    animation: toastIn 0.25s ease-out, toastOut 0.3s ease-in 2.7s forwards;
    max-width: 270px;
  }
  .toast.toast-purple { border-left-color: var(--indigo); }
  .toast.toast-green  { border-left-color: var(--green); }
  @keyframes toastIn  { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(16px); } }

  /* ── VERSION BADGE ── */
  #version-badge {
    position: fixed;
    bottom: 8px;
    left: 12px;
    font-size: 10px;
    color: #CFCFCF;
    z-index: 999;
    pointer-events: none;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-size: 16px;
    display: none;
  }
  .empty-state.visible { display: block; }

  /* ── SLOT PLACEHOLDER (invisible gap while sold item clears) ── */
  .slot-placeholder {
    min-height: 210px;
    background: transparent;
    border: none;
  }

  /* Tile fade-in when entering "On the Block" */
  @keyframes tileIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }
  .tile.entering { animation: tileIn 0.5s ease-out forwards; }

  /* ── PAGE MAX-WIDTH ── */
  .header-toolbar { max-width: 1680px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  .header-nav-inner { max-width: 1680px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
  .auction-bar { padding-left: 24px; padding-right: 24px; }
  .legend-bar  { padding-left: 24px; padding-right: 24px; }
  .grid-container { padding: 10px 24px 40px; max-width: 1680px; margin: 0 auto; }

  /* ── SECTIONS ── */
  .auction-section { margin-bottom: 32px; }
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 0 10px;
    border-bottom: 2px solid var(--card-border);
    margin-bottom: 12px;
  }
  .section-header--hot {
    border-bottom-color: var(--orange);
  }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .section-header--hot .section-title {
    color: var(--orange);
  }
  .section-count {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }
</style>
</head>
<body>

  <!-- Bottom nav -->
  <div class="header-nav">
    <div class="header-nav-inner">
      <button class="header-nav-item">Browse by category <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg></button>
      <button class="header-nav-item">Auctions <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg></button>
      <button class="header-nav-item">How it works <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg></button>

</header>


<!-- GRID -->
<div class="grid-container">

  <div class="auction-section" id="section-hot">
    <div class="section-header section-header--hot">
      <span class="section-title">On the Block</span>
      <span class="section-count" id="hot-count"></span>
    </div>
    <div class="grid" id="grid-hot"></div>
  </div>

  <div class="auction-section" id="section-upcoming">
    <div class="section-header section-header--upcoming">
      <span class="section-title">Upcoming Items</span>
      <span class="section-count" id="upcoming-count"></span>
    </div>
    <div class="grid" id="grid-upcoming"></div>
  </div>

  <div class="empty-state" id="empty-state">All lots have sold. Auction complete.</div>
</div>

<!-- TOASTS -->
<div class="toast-container" id="toast-container"></div>

<!-- VERSION -->
<div id="version-badge"></div>

<script src="../shared/tile.js"></script>
<script>
// ── DATA GENERATION ──────────────────────────────────────────────────────────

const THUMBNAILS = [
  'thumbnails/1.jpg','thumbnails/2.jpg','thumbnails/4.jpg','thumbnails/5.jpg',
  'thumbnails/6.jpg','thumbnails/7.jpg','thumbnails/8.jpg','thumbnails/9.jpg',
  'thumbnails/10.jpg','thumbnails/11.jpg',
];

const MAKES = ['CAT', 'John Deere', 'Komatsu', 'Volvo CE', 'Hitachi', 'Case', 'Bobcat', 'JCB', 'Liebherr', 'Terex'];

const EQUIPMENT_TYPES = [
  { type: 'Excavator',             models: ['320', '336', '349', 'PC200', 'PC300', 'ZX210', 'EC220', 'ZAxis 210'],      baseBid: 85000,  spread: 180000, color: '#E8EEF4' },
  { type: 'Wheel Loader',          models: ['980', '644K', 'WA380', 'L150H', 'ZW220', 'W170F'],                         baseBid: 65000,  spread: 220000, color: '#E8F2EC' },
  { type: 'Bulldozer',             models: ['D6T', 'D8T', 'D65EX', 'D155AX', '850K', '1050K'],                          baseBid: 110000, spread: 320000, color: '#F5EDE8' },
  { type: 'Motor Grader',          models: ['12M3', '140M3', 'GD655', 'F10C', 'G940B', 'G946'],                         baseBid: 75000,  spread: 250000, color: '#F4F2E8' },
  { type: 'Skid Steer',            models: ['S650', 'T650', '324G', '330G', 'S770', 'T770'],                             baseBid: 22000,  spread: 48000,  color: '#EAF0F5' },
  { type: 'Articulated Dump Truck',models: ['745', '740GC', 'TA300', 'A40G', 'TA400', 'HM400'],                         baseBid: 160000, spread: 350000, color: '#F0EBF8' },
  { type: 'Compactor',             models: ['CS56B', 'CP56B', 'SD122B', 'CS533E', 'CD1100C'],                            baseBid: 32000,  spread: 110000, color: '#E8F5F2' },
  { type: 'Telehandler',           models: ['TH407', 'TH514', '3518F', '4014F', 'HI-VIZ 3017'],                         baseBid: 38000,  spread: 140000, color: '#F5EFE8' },
];

const LOCATIONS = [
  'Houston, TX', 'Dallas, TX', 'Denver, CO', 'Atlanta, GA',
  'Chicago, IL', 'Phoenix, AZ', 'Portland, OR', 'Charlotte, NC',
  'Nashville, TN', 'Kansas City, MO', 'Tulsa, OK', 'Salt Lake City, UT',
];

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 0xffffffff;
  };
}

function generateItems() {
  const items = [];
  const now = Date.now();

  for (let i = 0; i < 100; i++) {
    const rng = seededRandom(i * 137 + 42);
    const typeIdx = Math.floor(rng() * EQUIPMENT_TYPES.length);
    const eq = EQUIPMENT_TYPES[typeIdx];
    const make = MAKES[Math.floor(rng() * MAKES.length)];
    const model = eq.models[Math.floor(rng() * eq.models.length)];
    const year = 2015 + Math.floor(rng() * 9);
    const location = LOCATIONS[Math.floor(rng() * LOCATIONS.length)];
    const simCap = 10000 + Math.floor(rng() * 490000);
    // Items closing soonest (i=0) start near 90% of cap; latest (i=99) near 30%
    const fraction = i / 99;
    const baseProgress = 0.9 - fraction * 0.6;
    const jitter = (rng() - 0.5) * 0.12;
    const bidProgress = Math.max(0.05, Math.min(0.95, baseProgress + jitter));
    const rawBid = Math.round(simCap * bidProgress);
    const startIncrement = getBidIncrement(rawBid);
    const startBid = Math.max(startIncrement, Math.floor(rawBid / startIncrement) * startIncrement);
    const bidCount = Math.round(5 + bidProgress * 70 + rng() * 25);
    // Hours scale with age: ~1000–1600 hrs/year, rounded to nearest 10
    const hoursPerYear = 1000 + Math.floor(rng() * 600);
    const hours = Math.round((hoursPerYear * (2026 - year) + Math.floor(rng() * 500)) / 10) * 10;
    const lotNum = 1001 + i;
    const watchlisted = lotNum === 1004 || lotNum === 1011 || lotNum === 1017;
    const thumbnail = watchlisted ? 'thumbnails/5.jpg' : THUMBNAILS[Math.floor(rng() * THUMBNAILS.length)];

    // Items close 10s apart; first at 10s, last at ~1000s
    const closeTime = now + (10 + i * 10) * 1000;

    items.push({
      id: lotNum,
      lotNum,
      year,
      make,
      model,
      type: eq.type,
      bgColor: eq.color,
      thumbnail,
      location,
      currentBid: startBid,
      bidCount,
      closeTime,
      originalClose: closeTime,
      status: 'active',
      extendedUntil: 0,
      extendCount: 0,
      watchlisted,
      userBid: false,
      userWinning: false,
      simCap,
      hours,
    });
  }

  // Sort by closeTime
  items.sort((a, b) => a.closeTime - b.closeTime);
  return items;
}

// ── STATE ────────────────────────────────────────────────────────────────────

let items = generateItems();
let soldCount = 0;
let totalSales = 0;
const hotItemIds  = new Set();   // item ids currently in the hot grid
const itemHotSlot = new Map();   // itemId → fixed slot index (0–7)
const freeHotSlots = [];         // slot indices freed by sold items, awaiting reuse

// ── RENDER ───────────────────────────────────────────────────────────────────

const HOT_SIZE = 8;

function renderGrid() {
  const hotGrid      = document.getElementById('grid-hot');
  const upcomingGrid = document.getElementById('grid-upcoming');
  const emptyState   = document.getElementById('empty-state');

  // Clear any lingering placeholders from simultaneous sells before rebuilding
  hotGrid.querySelectorAll('.slot-placeholder').forEach(ph => ph.remove());

  // Hot = 8 soonest by original close time (stable — extensions don't reorder)
  const active = items.filter(i => i.status === 'active')
    .sort((a, b) => a.originalClose - b.originalClose);

  const hotItems      = active.slice(0, HOT_SIZE);
  const upcomingItems = active.slice(HOT_SIZE);

  // Remove tiles for items that are no longer active
  for (const el of document.querySelectorAll('.tile')) {
    if (!active.find(i => i.id === Number(el.dataset.id))) el.remove();
  }

  // Hot grid: each item keeps its slot forever; only new arrivals get a slot assigned
  const newHotIds = new Set(hotItems.map(i => i.id));
  for (let idx = 0; idx < hotItems.length; idx++) {
    const item = hotItems[idx];
    const entering = !hotItemIds.has(item.id);
    let tile = document.getElementById(`tile-${item.id}`);
    if (!tile) tile = buildTile(item);

    if (entering) {
      // Reuse the freed slot from the item that just sold, else fall back to idx
      const slot = freeHotSlots.length > 0 ? freeHotSlots.shift() : idx;
      itemHotSlot.set(item.id, slot);
      tile.style.order = slot;
    }
    // Existing items: order was already set — don't touch it

    if (tile.parentElement !== hotGrid) {
      hotGrid.appendChild(tile);
      if (entering) {
        tile.classList.add('entering');
        setTimeout(() => tile.classList.remove('entering'), 500);
      }
    }
  }
  hotItemIds.clear();
  newHotIds.forEach(id => hotItemIds.add(id));

  // Upcoming grid
  for (let idx = 0; idx < upcomingItems.length; idx++) {
    const item = upcomingItems[idx];
    let tile = document.getElementById(`tile-${item.id}`);
    if (!tile) tile = buildTile(item);
    if (tile.parentElement !== upcomingGrid) upcomingGrid.appendChild(tile);
    tile.style.order = idx;
  }

  const hotCount      = hotItems.length;
  const upcomingCount = upcomingItems.length;
  document.getElementById('hot-count').textContent      = `${hotCount} lot${hotCount !== 1 ? 's' : ''}`;
  document.getElementById('upcoming-count').textContent = `${upcomingCount} lot${upcomingCount !== 1 ? 's' : ''}`;
  document.getElementById('section-hot').style.display      = hotCount > 0      ? '' : 'none';
  document.getElementById('section-upcoming').style.display = upcomingCount > 0 ? '' : 'none';

  emptyState.classList.toggle('visible', active.length === 0);
}

function updateBidStatus(item) {
  const el = document.getElementById(`status-${item.id}`);
  if (!el) return;
  el.className = 'bid-status-banner' + (item.userBid ? (item.userWinning ? ' winning' : ' outbid') : '');
  el.textContent  = item.userBid ? (item.userWinning ? 'Winning' : 'Outbid') : '';
}

function updateTile(item, secsLeft) {
  if (secsLeft === undefined) secsLeft = Math.max(0, Math.ceil((item.closeTime - Date.now()) / 1000));
  const state = timerState(secsLeft);
  const pct = progressPct(item);

  const tile = document.getElementById(`tile-${item.id}`);
  if (!tile) return;

  tile.className = `tile state-${state}${item.watchlisted ? ' watchlisted' : ''}`;

  // Update timer
  const timerEl = document.getElementById(`timer-${item.id}`);
  if (timerEl) timerEl.textContent = formatTime(secsLeft);

  // Update progress
  const prog = document.getElementById(`prog-${item.id}`);
  if (prog) prog.style.width = pct + '%';

  // Extended badge
  const badge = document.getElementById(`badge-${item.id}`);
  if (badge) badge.classList.toggle('visible', Date.now() < item.extendedUntil);

  // Bid info
  const bidEl = document.getElementById(`bid-${item.id}`);
  if (bidEl) bidEl.textContent = fmt$(item.currentBid);
  const countEl = document.getElementById(`count-${item.id}`);
  if (countEl) countEl.textContent = item.bidCount + ' bids';
  updateBidStatus(item);

  const btnEl = document.getElementById(`btn-${item.id}`);
  if (btnEl) {
    if (secsLeft <= 0) {
      btnEl.classList.remove('urgent-flash', 'flash');
      btnEl.classList.add('sold');
      btnEl.disabled = true;
      btnEl.textContent = 'SOLD';
    } else if (!btnEl.classList.contains('flash')) {
      btnEl.classList.toggle('urgent-flash', secsLeft < 15);
    }
  }
}


// ── ACTIONS ──────────────────────────────────────────────────────────────────

function extendItem(item, addSeconds) {
  item.closeTime += addSeconds * 1000;
  item.extendedUntil = Date.now() + 5000;
  item.extendCount++;
}

function sellItem(item) {
  if (item.status === 'sold') return;
  item.status = 'sold';
  soldCount++;
  totalSales += item.currentBid;

  const overlay = document.getElementById(`overlay-${item.id}`);
  if (overlay) {
    overlay.querySelector('.sold-price').textContent = fmt$(item.currentBid);
    overlay.classList.add('visible');
  }

  const tile = document.getElementById(`tile-${item.id}`);
  const wasInHot = hotItemIds.has(item.id);
  const tileOrder = tile ? parseInt(tile.style.order, 10) || 0 : 0;

  setTimeout(() => {
    if (tile) tile.classList.add('selling');

    setTimeout(() => {
      if (tile) tile.remove();
      hotItemIds.delete(item.id);
      // Free this item's slot so the next entrant can inherit it
      const slot = itemHotSlot.get(item.id);
      if (slot !== undefined) { freeHotSlots.push(slot); itemHotSlot.delete(item.id); }

      const active = items.filter(i => i.status === 'active');
      if (active.length === 0) {
        document.getElementById('empty-state').classList.add('visible');
        return;
      }

      if (wasInHot) {
        // White placeholder holds the slot for 2s, then new item fades in
        const hotGrid = document.getElementById('grid-hot');
        const ph = document.createElement('div');
        ph.className = 'slot-placeholder';
        ph.style.order = tileOrder;
        hotGrid.appendChild(ph);

        setTimeout(() => { if (ph.parentElement) { ph.remove(); renderGrid(); } }, 2000);
      } else {
        renderGrid();
      }
    }, 700);
  }, 1800);
}

function toggleWatchlist(itemId) {
  const item = items.find(i => i.id === itemId);
  if (!item || item.status !== 'active') return;
  item.watchlisted = !item.watchlisted;

  const tile = document.getElementById(`tile-${item.id}`);
  const btn  = document.getElementById(`watch-${item.id}`);
  if (tile) tile.classList.toggle('watchlisted', item.watchlisted);
  if (btn) {
    btn.classList.toggle('active', item.watchlisted);
    btn.title = item.watchlisted ? 'Remove from watchlist' : 'Add to watchlist';
    const path = btn.querySelector('path');
    if (path) {
      path.setAttribute('fill',   item.watchlisted ? '#F57C00' : 'none');
      path.setAttribute('stroke', item.watchlisted ? '#F57C00' : '#9CA3AF');
    }
  }
}

function placeBid(itemId) {
  const item = items.find(i => i.id === itemId);
  if (!item || item.status !== 'active') return;

  const secsLeft = Math.max(0, Math.ceil((item.closeTime - Date.now()) / 1000));
  const increment = getBidIncrement(item.currentBid);
  item.currentBid += increment;
  item.bidCount++;

  // Mark user as winning bidder
  item.userBid = true;
  item.userWinning = true;
  updateBidStatus(item);

  // Auto-watchlist on bid
  if (!item.watchlisted) {
    item.watchlisted = true;
    const wBtn = document.getElementById(`watch-${item.id}`);
    if (wBtn) {
      wBtn.classList.add('active');
      wBtn.title = 'Remove from watchlist';
      const path = wBtn.querySelector('path');
      if (path) { path.setAttribute('fill','#F57C00'); path.setAttribute('stroke','#F57C00'); }
    }
  }

  let extended = false;
  if (secsLeft < 60) {
    extendItem(item, 60);
    extended = true;
  }

  // Flash button
  const btn = document.getElementById(`btn-${item.id}`);
  if (btn) {
    btn.classList.add('flash');
    btn.textContent = 'BID PLACED!';
    setTimeout(() => {
      btn.classList.remove('flash');
      btn.innerHTML = 'BID NOW &rarr;';
    }, 2500);
  }

  updateTile(item);

  if (extended) {
    showToast(`LOT #${item.lotNum} — Bid placed! Auto extended +1:00`, 'purple');
  } else {
    showToast(`LOT #${item.lotNum} — Bid placed! ${fmt$(item.currentBid)}`, 'orange');
  }
}

// ── SIMULATION ───────────────────────────────────────────────────────────────

function simBidOnItem(item) {
  if (item.currentBid >= item.simCap) return;
  const secsLeft = (item.closeTime - Date.now()) / 1000;
  const increment = getBidIncrement(item.currentBid);
  item.currentBid += increment;
  item.bidCount++;

  if (item.userBid && item.userWinning) {
    item.userWinning = false;
    updateBidStatus(item);
    showToast(`LOT #${item.lotNum} — You've been outbid!`, 'orange');
  }

  let extended = false;
  if (secsLeft < 60 && Math.random() < 0.65) {
    extendItem(item, 60);
    extended = true;
  }

  updateTile(item);

  if (extended && (item.watchlisted || item.userBid)) showToast(`LOT #${item.lotNum} — New bid! Auto extended`, 'purple');
}

function simulateActivity() {
  const now = Date.now();
  const active = items.filter(i => i.status === 'active');
  if (active.length === 0) return;

  // Weighted pool: hot items (< 90s) appear 4x, warm (< 5min) 2x, cool 1x
  const pool = [];
  for (const item of active) {
    const secs = (item.closeTime - now) / 1000;
    if (secs <= 0) continue;
    const weight = secs < 90 ? 4 : secs < 300 ? 2 : 1;
    for (let w = 0; w < weight; w++) pool.push(item);
  }
  if (pool.length === 0) return;

  // Pick 1–3 unique items per cycle
  const count = 1 + Math.floor(Math.random() * 3);
  const picked = new Set();
  for (let i = 0; i < count * 5 && picked.size < count; i++) {
    picked.add(pool[Math.floor(Math.random() * pool.length)]);
  }
  for (const item of picked) simBidOnItem(item);
}

// ── TICK ─────────────────────────────────────────────────────────────────────

function tick() {
  const now = Date.now();

  for (const item of items) {
    if (item.status !== 'active') continue;

    const msLeft = item.closeTime - now;

    if (msLeft <= -1000) {
      sellItem(item);
      continue;
    }

    const secsLeft = Math.max(0, Math.ceil(msLeft / 1000));
    updateTile(item, secsLeft);
  }
}

// ── TOASTS ───────────────────────────────────────────────────────────────────

function showToast(msg, type = 'orange') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3100);
}

// ── INIT ─────────────────────────────────────────────────────────────────────

renderGrid();
setInterval(tick, 1000);

setTimeout(function scheduleActivity() {
  simulateActivity();
  setTimeout(scheduleActivity, 2000 + Math.random() * 3000);
}, 6000);

// Version badge
const _v = document.querySelector('meta[name="build-version"]');
if (_v) document.getElementById('version-badge').textContent = 'v' + _v.content;

</script>
